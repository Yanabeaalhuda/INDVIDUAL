:root{--burg:#6f0d25;--burg2:#4d0719;--gold:#dfb667;--gold2:#f4d994;--ink:#28161d;--muted:#78646b;--bg:#f5f1ee;--panel:#fff;--line:#e7d9dd;--ok:#157347;--danger:#b42318;--shadow:0 12px 32px rgba(77,7,25,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:'ExpoArabic','HelveticaBold',Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}

h1,h2,h3,.btn,label,strong,b,.stat,.offer-title,.hotel-name{font-family:'GESSTwo','ExpoArabic',Arial,sans-serif}
input,select,textarea,button{font-family:'ExpoArabic','HelveticaBold',Arial,sans-serif}
.option-total b,.price-line b,.grand-total b,.quote-date,.phones{font-family:'HelveticaRounded','HelveticaBold','ExpoArabic',Arial,sans-serif;font-variant-numeric:tabular-nums}

.appbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--burg2),var(--burg));color:#fff;box-shadow:0 5px 24px rgba(60,0,18,.2)}
.appbar-inner{max-width:1480px;margin:auto;min-height:70px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand img{width:48px;height:48px;border-radius:50%;object-fit:contain;background:#78132e;border:1px solid rgba(255,255,255,.25)}.brand h1{font-size:17px;margin:0}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.shell{max-width:1480px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(430px,.92fr) minmax(500px,1.08fr);gap:18px;align-items:start}.column{min-width:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:15px}.panel h2,.panel h3{margin:0;color:var(--burg)}.panel-sub{font-size:12px;color:var(--muted);line-height:1.7;margin:6px 0 0}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.stat{display:inline-flex;align-items:center;white-space:nowrap;border:1px solid #e3c982;background:#fff8e5;color:#6a4508;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:700}
.grid{display:grid;gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field label{display:block;margin-bottom:6px;color:#583640;font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #d9c8ce;border-radius:10px;background:#fff;outline:none}.field textarea{resize:vertical;min-height:76px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(223,182,103,.18)}.help{display:block;color:var(--muted);font-size:10.5px;margin-top:5px;line-height:1.5}

.offer-card{border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px;background:linear-gradient(145deg,#fff,#fffdf9)}.offer-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.offer-title strong{color:var(--burg)}.pricing-fields{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.summary{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.summary span{padding:7px 9px;background:#f7edf0;border-radius:999px;color:#61414b;font-size:11px}.option-total{margin-top:10px;padding:10px 12px;border-radius:11px;background:linear-gradient(90deg,#5b091d,#7d1531);color:#fff;display:flex;justify-content:space-between;align-items:center}.option-total b{color:#f4d690;font-size:17px}
.preview-sticky{position:sticky;top:88px}.preview-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.preview-stage{background:#d2c8cb;border-radius:16px;padding:14px;max-height:calc(100vh - 130px);overflow:auto}.quote-page{width:794px;height:1123px;background:#fff;margin:0 auto 16px;position:relative;overflow:hidden;color:#32151e;box-shadow:0 10px 30px rgba(0,0,0,.14)}.quote-header{height:132px;background:linear-gradient(130deg,var(--burg2),var(--burg));color:#fff;padding:20px 28px;display:grid;grid-template-columns:100px 1fr 150px;align-items:center;gap:20px;border-bottom:7px solid var(--gold)}.quote-header img{width:92px;height:92px;object-fit:contain;border-radius:50%;background:#7b1531}.quote-title{text-align:center}.quote-title h1{margin:0;color:#f3d389;font-size:30px}.quote-title p{margin:8px 0 0;font-size:15px}.quote-date{text-align:left;font-size:13px;line-height:1.8}.quote-body{padding:28px 34px 125px}.greeting{border-right:5px solid var(--gold);padding:13px 16px;background:#fff8ea;border-radius:10px;line-height:1.9;margin-bottom:18px}.preview-offer{border:1px solid #e6d5da;border-radius:17px;overflow:hidden;margin-bottom:14px;break-inside:avoid;background:#fff}.preview-offer-head{background:#f8e8ed;color:var(--burg);padding:11px 16px;font-weight:700;display:flex;justify-content:space-between}.preview-offer-body{padding:14px 16px}.hotel-name{font-size:20px;font-weight:800;color:var(--burg);margin-bottom:10px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.detail{border:1px solid #eee1e4;border-radius:9px;padding:8px;background:#fffdfb}.detail b{display:block;font-size:10px;color:#8a6f77;margin-bottom:4px}.detail span{font-size:12px;font-weight:700}.price-line{margin-top:10px;border-top:1px dashed #d8bdc5;padding-top:10px;display:flex;justify-content:space-between;gap:15px;align-items:center}.price-line b{color:var(--burg);font-size:18px}.grand-total{margin:18px 0;padding:15px 18px;border-radius:13px;background:linear-gradient(90deg,var(--burg2),var(--burg));color:#fff;display:flex;justify-content:space-between;align-items:center}.grand-total b{font-size:23px;color:#f4d690}.closing{line-height:1.9;background:#faf4f5;border-radius:12px;padding:13px 15px}.quote-footer{position:absolute;bottom:0;left:0;right:0;background:#4c0718;color:#fff;border-top:5px solid var(--gold);padding:14px 28px;text-align:center}.phones{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:#f2d68e;font-weight:700;font-size:13px}.phones .phone-number{direction:ltr;unicode-bidi:isolate;display:inline-block}.company-line{font-size:11px;margin-top:7px;color:#ecdfe3}
.saved-list{display:grid;gap:9px}.saved-item{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;display:flex;justify-content:space-between;gap:10px;align-items:center}.saved-meta{min-width:0}.saved-meta b{display:block;color:var(--burg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved-meta small{color:var(--muted)}.saved-actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:22px;border:1px dashed #d8c5cb;border-radius:12px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:#27131a;color:#fff;border-radius:12px;padding:11px 16px;opacity:0;transition:.25s;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.24)}.toast.show{transform:translate(-50%,0);opacity:1}.mobile-tabs{display:none}
@media(max-width:1050px){.shell{grid-template-columns:1fr}.preview-sticky{position:static}.preview-stage{max-height:none}.quote-page{transform-origin:top center}.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){body{padding-bottom:66px}.appbar-inner{min-height:62px;padding:8px 12px}.brand img{width:42px;height:42px}.brand h1{font-size:14px}.top-actions{display:none}.shell{padding:10px;display:block}.panel{padding:14px;border-radius:14px}.grid.two,.grid.three,.pricing-fields{grid-template-columns:1fr}.section-head{align-items:stretch;flex-direction:column}.section-head .btn{width:100%}.preview-stage{padding:6px}.quote-page{width:794px;transform:scale(var(--preview-scale,.44));transform-origin:top right;margin-bottom:calc(-1123px * (1 - var(--preview-scale,.44)))}.mobile-tabs{position:fixed;z-index:100;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 -5px 22px rgba(70,12,30,.12)}.mobile-tabs button{border:0;background:#fff;color:#71545d;font-size:11px;font-weight:700}.mobile-tabs button.active{color:var(--burg);background:#fff6f7}.column.mobile-hidden{display:none}.saved-item{align-items:flex-start;flex-direction:column}.saved-actions{width:100%}.saved-actions .btn{flex:1}}
@media print{body{background:#fff!important}.appbar,.editor-column,.preview-tools,.mobile-tabs,.toast{display:none!important}.shell{display:block;max-width:none;padding:0}.preview-column{display:block!important}.panel.preview-panel{border:0;box-shadow:none;padding:0;margin:0}.preview-stage{padding:0;background:#fff;overflow:visible;max-height:none}.quote-page{width:210mm;height:297mm;box-shadow:none;margin:0;transform:none!important;page-break-after:always;break-after:page}.quote-page:last-child{page-break-after:auto;break-after:auto}.preview-offer{break-inside:avoid}.quote-footer{position:fixed;bottom:0}}

body.auth-locked{overflow:hidden}
body.auth-locked .app-shell,body.auth-locked .mobile-nav{display:none!important}
.auth-gate{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#4c0718,#8b1535)}
body.auth-locked .auth-gate{display:flex}
.auth-card{width:min(430px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 25px 70px rgba(0,0,0,.35);text-align:center}
.auth-card h2{margin:0 0 8px;color:#6f0d25}.auth-card p{margin:0 0 20px;color:#755d65}
.auth-card input{width:100%;box-sizing:border-box;text-align:center;direction:ltr;font-size:18px;margin-bottom:12px}
.auth-error{min-height:22px;color:#b42318;font-weight:700;font-size:13px;margin-top:8px}

</head>
<body class="auth-locked">
<div id="authGate" class="auth-gate" aria-modal="true" role="dialog">
  <form id="authForm" class="auth-card" autocomplete="off">
    <h2>ينابيع الهدى المتميزة</h2>
    <p>أدخل كلمة المرور لفتح البرنامج</p>
    <input id="authPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>
    <button class="btn primary" type="submit" style="width:100%">فتح البرنامج</button>
    <div id="authError" class="auth-error"></div>
  </form>
</div>
<header class="appbar"><div class="appbar-inner"><div class="brand"><img id="brandLogo" alt="الشعار"><div><h1 id="appTitle">عرض سعر للأفراد</h1></div></div><div class="top-actions"><button class="btn gold" id="newQuoteTop">عرض جديد</button><button class="btn light" id="saveQuoteTop">حفظ العرض</button><button class="btn outline" id="printTop">طباعة / PDF</button></div></div></header>
<main class="shell">
<section class="column editor-column" id="editorColumn">
  <div class="panel" id="customerPanel"><div class="section-head"><div><h2>بيانات عرض السعر</h2></div><span class="stat" id="grandStat">الإجمالي: 0</span></div>
    <div class="grid three">
      <div class="field"><label>اسم العميل</label><input id="customerName" placeholder="اسم العميل"></div>
      <div class="field"><label>تاريخ العرض</label><input type="date" id="quoteDate"></div>
      <div class="field"><label>العملة</label><input id="currency" value="ريال سعودي"></div>
      <div class="field" style="grid-column:1/-1"><label>رسالة المقدمة</label><input id="intro"></div>
    </div>
  </div>
  <div class="panel"><div class="section-head"><div><h3>خيارات الإقامة</h3></div><button class="btn primary" id="addOffer">+ إضافة خيار</button></div><div id="offers"></div></div>
  <div class="panel"><h3>الرسالة والملاحظات</h3><div class="grid two" style="margin-top:12px"><div class="field"><label>ملاحظة الأسعار</label><textarea id="notes"></textarea></div><div class="field"><label>رسالة الختام</label><textarea id="closing"></textarea></div></div><div class="actions" style="margin-top:13px"><button class="btn primary" id="copyText">نسخ رسالة واتساب</button><button class="btn gold" id="saveQuote">حفظ العرض</button><button class="btn outline" id="newQuote">عرض جديد</button></div></div>
  <div class="panel" id="savedPanel"><div class="section-head"><div><h3>العروض المحفوظة</h3></div><div class="actions"><button class="btn outline small" id="exportBackup">حفظ نسخة احتياطية</button><label class="btn light small" for="importBackup">رفع نسخة احتياطية</label><input id="importBackup" type="file" accept="application/json" hidden></div></div><div id="savedList"></div></div>
  <div class="panel" id="settingsPanel"><div class="section-head"><div><h3>إعدادات الشركة</h3></div></div><div class="grid two"><div class="field"><label>اسم الشركة</label><input id="companyName"></div><div class="field"><label>وصف الخدمة</label><input id="companyLine"></div><div class="field"><label>أرقام التواصل (افصل بينها بفاصلة)</label><input id="phones" dir="ltr" inputmode="tel" style="text-align:right;unicode-bidi:plaintext"></div><div class="field"><label>رفع شعار بديل</label><input type="file" id="logoUpload" accept="image/*"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="saveSettings">حفظ الإعدادات</button><button class="btn outline" id="resetLogo">إرجاع الشعار الأصلي</button></div></div>
</section>
<section class="column preview-column" id="previewColumn"><div class="panel preview-panel preview-sticky"><div class="preview-tools"><div><h3>معاينة عرض السعر</h3></div><div class="actions"><button class="btn primary" id="printQuote">طباعة / PDF</button></div></div><div class="preview-stage"><div id="quotePages"></div></div></div></section>
</main>
<nav class="mobile-tabs"><button class="active" data-mobile-tab="editor">البيانات</button><button data-mobile-tab="preview">المعاينة</button><button data-mobile-tab="saved">المحفوظات</button><button data-mobile-tab="settings">الإعدادات</button></nav>
<div class="toast" id="toast"></div>
<datalist id="hotelNames"></datalist><datalist id="roomTypes"></datalist><datalist id="mealPlans"></datalist><datalist id="views"></datalist>
<script src="./app.js"></script>
</body>
</html>
